<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Join the loyalty card</title>
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --dim: #94a3b8;
        --accent: #38bdf8;
        --accent-text: #04283a;
        --danger: #f87171;
        --success: #34d399;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .mark { color: var(--accent); font-size: 34px; text-align: center; }
      h1 { font-size: 24px; margin: 8px 0 4px; text-align: center; }
      .sub { color: var(--dim); font-size: 15px; text-align: center; margin: 0 0 24px; line-height: 1.5; }
      label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .3px; color: var(--dim); margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 14px;
        font-size: 16px; /* 16px stops iOS zooming the page on focus */
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 16px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
      }
      button[disabled] { opacity: .55; cursor: default; }
      .msg { font-size: 14px; margin: 0 0 16px; line-height: 1.5; }
      .msg.error { color: var(--danger); }
      .fine { color: var(--dim); font-size: 12px; text-align: center; margin: 20px 0 0; line-height: 1.6; }
      .done { text-align: center; }
      .done .tick { font-size: 48px; color: var(--success); }
      /* Honeypot: kept out of the layout and out of the tab order, but still a
         real, fillable field as far as an automated form-filler is concerned. */
      .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="mark">&#9670;</div>
      <h1 id="title">Loading&hellip;</h1>
      <p class="sub" id="sub">Fetching the details of this loyalty card.</p>

      <form id="form" hidden novalidate>
        <p class="msg error" id="error" hidden></p>

        <label for="name">YOUR NAME</label>
        <input id="name" name="name" autocomplete="name" required maxlength="80" placeholder="Sam Taylor" />

        <label for="email">YOUR EMAIL</label>
        <input id="email" name="email" type="email" autocomplete="email" required inputmode="email" placeholder="sam@example.com" />

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit">Join the card</button>
        <p class="fine">
          We will only email you about your loyalty card. Your address is never sold or shared.
        </p>
      </form>
    </main>

    <script>
      // The join link is /join/{uid} — the owner's Firebase uid doubles as the
      // business id, so the URL carries everything this page needs.
      const uid = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');

      const el = (id) => document.getElementById(id);
      const title = el('title');
      const sub = el('sub');
      const form = el('form');
      const errorBox = el('error');
      const submit = el('submit');

      function fail(heading, detail) {
        title.textContent = heading;
        sub.textContent = detail;
        form.hidden = true;
      }

      function showError(text) {
        errorBox.textContent = text;
        errorBox.hidden = false;
      }

      async function load() {
        if (!uid || uid === 'join') {
          return fail('Link incomplete', 'Scan the QR code again, or ask the shop for a fresh link.');
        }
        try {
          const res = await fetch('/api/business?uid=' + encodeURIComponent(uid));
          if (!res.ok) throw new Error('not found');
          const data = await res.json();
          const name = data.businessName || 'our loyalty card';
          title.textContent = 'Join ' + name;
          sub.textContent = 'Collect a point every visit. We will email you the moment a reward is yours.';
          document.title = 'Join ' + name;
          form.hidden = false;
          el('name').focus();
        } catch {
          fail('This card could not be found', 'The link may be out of date. Ask the shop for a fresh QR code.');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const name = el('name').value.trim();
        const email = el('email').value.trim();
        if (!name) return showError('Please enter your name.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
          return showError('That email address does not look right.');
        }

        submit.disabled = true;
        submit.textContent = 'Joining…';

        try {
          const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, name, email, website: el('website').value }),
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.ok) {
            showError(data.error || 'Something went wrong. Please try again.');
            submit.disabled = false;
            submit.textContent = 'Join the card';
            return;
          }

          el('card').innerHTML =
            '<div class="done"><div class="tick">&#10003;</div>' +
            '<h1>' + (data.alreadyMember ? "You're already on the list" : "You're in") + '</h1>' +
            '<p class="sub">' +
            (data.alreadyMember
              ? 'That email is already collecting points. Just give your name at the counter.'
              : 'Check your inbox for a welcome email. Give your name at the counter and we will add your points.') +
            '</p></div>';
        } catch {
          showError('No connection. Check your signal and try again.');
          submit.disabled = false;
          submit.textContent = 'Join the card';
        }
      });

      load();
    </script>
  </body>
</html>
