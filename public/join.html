<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Join the loyalty card</title>
    <style>
      /* Loyalty Link brand colours — the app's default. applyTheme() overwrites these with
         whatever the shop picked under Appearance. */
      :root {
        --bg: #f7f3ea;
        --surface: #ffffff;
        --border: #e0dbd0;
        --text: #2c3a52;
        --dim: #6b7585;
        --accent: #8caa80;
        --accent-text: #ffffff;
        --danger: #b4544a;
        --success: #4b7a55;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .mark { font-size: 34px; text-align: center; }
      h1 { font-size: 24px; margin: 8px 0 4px; text-align: center; }
      .sub { color: var(--dim); font-size: 15px; text-align: center; margin: 0 0 24px; line-height: 1.5; }
      label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .3px; color: var(--dim); margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 14px;
        font-size: 16px; /* 16px stops iOS zooming the page on focus */
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 16px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
      }
      button[disabled] { opacity: .55; cursor: default; }
      .msg { font-size: 14px; margin: 0 0 16px; line-height: 1.5; }
      .msg.error { color: var(--danger); }
      .fine { color: var(--dim); font-size: 12px; text-align: center; margin: 20px 0 0; line-height: 1.6; }
      .done { text-align: center; }
      .done .tick { font-size: 48px; color: var(--success); }
      /* Honeypot: out of the layout and out of the tab order, but still a real
         fillable field as far as an automated form-filler is concerned. */
      .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="mark">&#127807;</div>
      <h1 id="title">Loading&hellip;</h1>
      <p class="sub" id="sub">Fetching the details of this loyalty card.</p>

      <form id="form" hidden novalidate>
        <p class="msg error" id="error" hidden></p>

        <label for="name">YOUR NAME</label>
        <input id="name" name="name" autocomplete="name" required maxlength="80" placeholder="Sam Taylor" />

        <label for="email">YOUR EMAIL</label>
        <input id="email" name="email" type="email" autocomplete="email" required inputmode="email" placeholder="sam@example.com" />

        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit">Join the card</button>
        <p class="fine">
          We will only email you about your loyalty card. Your address is never sold or shared.
        </p>
      </form>
    </main>

    <script src="/firebase-config.js"></script>
    <script>
      // This page has no server behind it — Cloud Functions need the paid plan.
      // It talks to the Firestore REST API using the project's public API key,
      // which authorises nothing on its own. firestore.rules is what allows a
      // read of users/{uid}/public/profile and a create of one signup request,
      // and nothing else: this page cannot read the customer list, cannot see
      // what anyone else submitted, and cannot add a customer directly.
      const CFG = window.FIREBASE_CONFIG || {};
      const DOCS = `https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;

      // The join link is /join/{uid} — the owner's uid doubles as the business id.
      const uid = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');

      const el = (id) => document.getElementById(id);
      const title = el('title');
      const sub = el('sub');
      const form = el('form');
      const errorBox = el('error');
      const submit = el('submit');

      let businessName = '';

      function fail(heading, detail) {
        title.textContent = heading;
        sub.textContent = detail;
        form.hidden = true;
      }

      function showError(text) {
        errorBox.textContent = text;
        errorBox.hidden = false;
      }

      // The shop picks its colours in the app; this page wears them too, so the
      // QR code does not lead somewhere that looks like a different business.
      function applyTheme(theme) {
        if (!theme) return;
        const accent = theme.accent?.stringValue;
        const paper = theme.paper?.stringValue;
        const ink = theme.ink?.stringValue;
        const ok = (v) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v || '');
        const root = document.documentElement.style;
        if (ok(paper)) { root.setProperty('--bg', paper); root.setProperty('--surface', '#ffffff'); }
        if (ok(ink)) { root.setProperty('--text', ink); root.setProperty('--dim', mix(ink, paper || '#ffffff', 0.45)); }
        if (ok(accent)) {
          root.setProperty('--accent', accent);
          root.setProperty('--accent-text', luminance(accent) > 0.45 ? '#22251f' : '#ffffff');
          root.setProperty('--border', mix(paper || '#ffffff', ink || '#333333', 0.16));
        }
      }

      function mix(a, b, amount) {
        const p = (h) => { const n = parseInt(h.replace('#',''), 16); return [(n>>16)&255,(n>>8)&255,n&255]; };
        const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b);
        const c = (x,y) => Math.round(x + (y-x)*amount).toString(16).padStart(2,'0');
        return '#' + c(r1,r2) + c(g1,g2) + c(b1,b2);
      }

      function luminance(hex) {
        const n = parseInt(hex.replace('#',''), 16);
        const ch = (v) => { const s = v/255; return s <= 0.03928 ? s/12.92 : Math.pow((s+0.055)/1.055, 2.4); };
        return 0.2126*ch((n>>16)&255) + 0.7152*ch((n>>8)&255) + 0.0722*ch(n&255);
      }

      async function load() {
        if (!uid || uid === 'join') {
          return fail('Link incomplete', 'Scan the QR code again, or ask the shop for a fresh link.');
        }
        if (!CFG.projectId || !CFG.apiKey) {
          return fail('Not configured', 'This signup page is missing its Firebase settings.');
        }
        try {
          const res = await fetch(
            `${DOCS}/users/${encodeURIComponent(uid)}/public/profile?key=${CFG.apiKey}`
          );
          if (!res.ok) throw new Error('not found');
          const doc = await res.json();
          businessName = doc.fields?.businessName?.stringValue || 'our loyalty card';
          applyTheme(doc.fields?.theme?.mapValue?.fields);
          title.textContent = 'Join ' + businessName;
          sub.textContent =
            'Collect a point every visit. We will let you know the moment a reward is yours.';
          document.title = 'Join ' + businessName;
          form.hidden = false;
          el('name').focus();
        } catch {
          fail(
            'This card could not be found',
            'The link may be out of date. Ask the shop for a fresh QR code.'
          );
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const name = el('name').value.trim().slice(0, 80);
        const email = el('email').value.trim().toLowerCase();

        // Honeypot. Show the bot a success screen so it does not retry, and
        // write nothing.
        if (el('website').value) return done(false);

        if (!name) return showError('Please enter your name.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
          return showError('That email address does not look right.');
        }

        submit.disabled = true;
        submit.textContent = 'Joining…';

        try {
          const res = await fetch(
            `${DOCS}/users/${encodeURIComponent(uid)}/signupRequests?key=${CFG.apiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                fields: {
                  name: { stringValue: name },
                  email: { stringValue: email },
                  status: { stringValue: 'pending' },
                  createdAt: { timestampValue: new Date().toISOString() },
                },
              }),
            }
          );

          if (!res.ok) {
            // A rules rejection lands here. Do not show the raw Firestore error.
            showError('Something went wrong. Please try again, or ask at the counter.');
            submit.disabled = false;
            submit.textContent = 'Join the card';
            return;
          }
          done(true);
        } catch {
          showError('No connection. Check your signal and try again.');
          submit.disabled = false;
          submit.textContent = 'Join the card';
        }
      });

      function done() {
        el('card').innerHTML =
          '<div class="done"><div class="tick">&#10003;</div>' +
          "<h1>You're on the list</h1>" +
          '<p class="sub">' +
          (businessName ? businessName + ' will' : 'The shop will') +
          ' add you to their card shortly. Just give your name at the counter and they will start ' +
          'adding your points.</p></div>';
      }

      load();
    </script>
  </body>
</html>
